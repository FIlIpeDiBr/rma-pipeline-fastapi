[project]
name = "rma-backend"
version = "0.1.0"
description = "Sistema RMA v2 — backend (API + worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "procrastinate>=2.13,<4",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "boto3>=1.34",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.8",
    "anthropic>=0.34",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "docxtpl>=0.16",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Texto de prompt: linhas do JSON de exemplo podem passar de 100 colunas.
"app/extraction/prompts.py" = ["E501"]
"app/domain/indicadores.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os testes de integração apagam dados e exigem Postgres: só rodam com `-m integracao`.
addopts = "-m 'not integracao'"
markers = [
    "integracao: API sobre Postgres real (requer RMA_TESTE_INTEGRACAO=1 e banco *_teste)",
]
