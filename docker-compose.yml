# Apenas para desenvolvimento local: Postgres igual ao do Render.
# Uso: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rma
    ports:
      - "5432:5432"
    volumes:
      - rma_pgdata:/var/lib/postgresql/data

volumes:
  rma_pgdata:
